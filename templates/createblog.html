{% extends 'base.html' %} 
{% block title %} Create Blog {% endblock %} 
{% block content %}
<div class="create-blog-container">
  {% if error %}
  <div class="error-msg"><p>{{error}}</p></div>
  {% endif %} 
  {% if success %}
  <div class="success-msg"><p>{{success}}</p></div>
  {% endif %}
  <h2>Create your blog</h2>
  <form method="post" action="/create-blog" enctype="multipart/form-data">
    <div class="form-group">
      <label>Blog heading</label>
      <input
        class="form-control"
        type="text"
        id="heading"
        name="heading"
        placeholder="Enter blog heading"
        required
      />
    </div>
    <div class="form-group">
      <label>Blog title</label>
      <textarea
        class="form-control"
        type="text"
        id="title"
        name="title"
        placeholder="Enter blog title"
        rows="8"
        required
      >{{title or ''}}</textarea>
    </div>
    <div class="form-group">
      <label>Upload blog image</label>
      <input
        class="form-control-file"
        type="file"
        id="file"
        name="file"
        accept="image*"
      />
      <small>Supported formats: JPG, PNG, GIF</small>
    </div>
    <div class="form-action">
      <button type="submit" class="btn btn-primary">Create Blog</button>
      <a href="/blogs" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
